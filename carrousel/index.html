<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🟨 JS | Módulo | Carrousel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
    <script src="js/index.js" defer></script>
</head>
<body>


    <div class="Carrousel">

        <div class="Carrousel-wrapper">
            <img src="assets/imagen0.avif" alt="0" class="Carrousel-img">
            <img src="assets/imagen1.avif" alt="1" class="Carrousel-img">
            <img src="assets/imagen2.avif" alt="2" class="Carrousel-img">
        </div>

        <button class="Carrousel-arrow Carrousel-arrow--prev">Prev</button>
        <button class="Carrousel-arrow Carrousel-arrow--next">Next</button>


        <ul class="Carrousel-ul">
            <li class="Carrousel-li">
                <button class="Carrousel-btn"></button>
            </li>
            <li class="Carrousel-li">
                <button class="Carrousel-btn"></button>
            </li>
            <li class="Carrousel-li">
                <button class="Carrousel-btn"></button>
            </li>
        </ul>

    </div>

   

</body>
</html>
